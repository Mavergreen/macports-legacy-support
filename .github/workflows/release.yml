name: release

# Builds the x86_64/min-10.9 macports-legacy-support .pkg on a modern Apple-Silicon runner
# (cross-target). One pipeline, three entry points:
#   - push to main: if UPSTREAM_VERSION has no release yet (Renovate just bumped it) -> cut
#     v<upstream>-mavericks.1. Otherwise build only (CI smoke), no release.
#   - workflow_dispatch (local_release=true): cut the next v<upstream>-mavericks.(N+1).
#   - v* tag: publish that exact version.
# the shared publish-release.yml makes the tag as part of publishing, so there is no second-hop trigger
# problem (GITHUB_TOKEN cannot retrigger a tag workflow) and no PAT is needed.

on:
  push:
    branches: [main]
    tags: ['*-mavericks.*']
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a local -mavericks.(N+1) release for the current upstream version"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver step decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26   # Apple Silicon; cross-builds x86_64/10.9. Use macos-15 if 26 is unavailable.
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # version.sh needs the full tag history

      - name: Install mavericks-shipyard
        # shipyard installs itself via its own action, which puts shipyard-cmake on PATH and
        # exports SHIPYARD_SCRIPTS. We do NOT clone it, hand-run an install, or vendor it as a
        # nested git checkout. @v1 is the moving major tag; Renovate's github-actions manager
        # tracks it (no SHA, no marker comment).
        uses: ModernMavericks/shipyard/.github/actions/install@v1

      - name: Resolve the installed shipyard scripts dir
        id: msc
        # install@v1 exports $SHIPYARD_SCRIPTS; this only re-publishes it as a step output for the steps
        # below that already reference steps.msc.outputs.scripts.
        run: |
          [ -d "$SHIPYARD_SCRIPTS" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          echo "scripts=$SHIPYARD_SCRIPTS" >> "$GITHUB_OUTPUT"

      # The shared runner takes the whole top-level suite, so a newly added test runs the day it
      # lands. This repo is why that matters: nine test files CI never ran, two of them rotted -- one
      # asserting Renovate's pre-migration fileMatch key, one checking an .icns filename that changed
      # when the repo was renamed. Neither was a product bug; both were invisible.
      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Compute version
        id: ver
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            full="$GITHUB_REF_NAME"; tag="$GITHUB_REF_NAME"; rel=yes
          else
            mode=auto
            if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
              mode=local
            fi
            out="$(sh build/version.sh "$mode")"
            full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
            tag="$(printf '%s\n' "$out"  | sed -n 's/^TAG=//p')"
            rel="$(printf '%s\n' "$out"  | sed -n 's/^RELEASE=//p')"
            # only main (push or workflow_dispatch) cuts a release; PRs and non-main branches never publish
            if [ "$GITHUB_REF_NAME" != main ]; then rel=no; fi
          fi
          printf '%s\n' "$full" > VERSION
          { echo "full=$full"; echo "tag=$tag"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full tag=$tag release=$rel"

      - name: Cross-build the library (x86_64 / min-10.9)
        run: sh build/build-lib.sh

      - name: Build the Sparkle updater (Cocoa/ObjC; must not link the library)
        run: |
          B=build/updater
          shipyard-cmake -S . -B "$B" -DCMAKE_OBJC_COMPILER=/usr/bin/clang
          shipyard-cmake --build "$B" --target LegacySupportUpdater
          bin="$B/LegacySupportUpdater.app/Contents/MacOS/LegacySupportUpdater"
          otool -L "$bin" | tee /tmp/o.txt
          ! grep -qi MacportsLegacySupport /tmp/o.txt || { echo "::error::updater links the library it updates"; exit 1; }

      - name: Package the .pkg (library + updater + 10.9.5 floor)
        run: |
          UPD_APP="build/updater/LegacySupportUpdater.app" \
          VERSION="${{ steps.ver.outputs.full }}" \
          sh build/package-pkg.sh

      # Generate the single notes file ONCE, before it has two consumers: the appcast's <description>
      # (next step) and the release body, which travels IN the artifact because publish-release.yml
      # does not check out the repo (dist/RELEASE_NOTES.md is uploaded below with the rest of dist/*).
      # Same bytes, same file, read twice -- so the Release page and Sparkle tell one story.
      - name: Generate release notes
        if: steps.ver.outputs.release == 'yes'
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "${{ steps.ver.outputs.tag }}" --version "${{ steps.ver.outputs.full }}" \
            --product 'MacPorts legacy-support' --min-os 10.9.5 --out dist/RELEASE_NOTES.md

      - name: EdDSA-sign the .pkg + generate the appcast
        if: steps.ver.outputs.release == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh` -> needs auth (else 403 rate-limit)
        run: |
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          SCRIPTS='${{ steps.msc.outputs.scripts }}'
          FULL="${{ steps.ver.outputs.full }}"; TAG="${{ steps.ver.outputs.tag }}"
          PKG="build/out/macports-legacy-support-${FULL}.pkg"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$PKG")"
          sh "$SCRIPTS/sign_and_appcast.sh" \
            --channel-title "MacPorts legacy-support (Mavericks)" --version "$FULL" \
            --pkg-url "$URL" --notes-file dist/RELEASE_NOTES.md --pkg "$PKG" --min-os 10.9.5 \
            > build/out/appcast.xml
          cat build/out/appcast.xml

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "build/out/macports-legacy-support-${{ steps.ver.outputs.full }}.pkg" dist/
          [ -f build/out/appcast.xml ] && cp build/out/appcast.xml dist/ || true

      # Conformance: do the artifacts about to be published agree with each other and with the
      # family's schemes? Gated like the signing step -- a non-publishing build has no appcast, and
      # this is a question about a release rather than about a build.
      - name: Artifact conformance
        if: steps.ver.outputs.release == 'yes'
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ steps.ver.outputs.full }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
          # Behavior gate: a client on the previous release must SEE this as an upgrade -- a numeric
          # sparkle:version that orders strictly after the last published one (ordering conformance
          # never exercised; the gap the "-mavericks.N compares EQUAL" bug shipped through).
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast dist/appcast.xml --version "${{ steps.ver.outputs.full }}"

      - uses: actions/upload-artifact@v7
        with:
          name: mavericks-legacysupport
          path: dist/*

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  scan:
    if: always() && (needs.build.outputs.publish == 'yes')   # a build that fails after signing left logs too; scan them
    needs: [build]
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: ModernMavericks/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: mavericks-legacysupport
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    if: needs.build.outputs.publish == 'yes'
    needs: [build, scan]
    permissions:
      contents: write
    uses: ModernMavericks/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: mavericks-legacysupport
